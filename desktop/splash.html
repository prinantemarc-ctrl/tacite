<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>Tacite</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #ffffff;
      color: #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-user-select: none;
      user-select: none;
    }
    .wrap { width: 420px; padding: 24px; }
    .rule { width: 52px; height: 2px; background: #6e6230; }
    .lockup { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .mark { width: 28px; height: 28px; color: #1c1c1c; flex-shrink: 0; }
    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .tag { margin-top: 4px; font-size: 12px; color: #9a9a9a; }
    .status {
      margin-top: 36px;
      font-size: 14px;
      line-height: 1.45;
      color: #6b6b6b;
      min-height: 2.9em;
    }
    .status.error { color: #8a2e2a; }
    .bar {
      margin-top: 22px;
      height: 2px;
      background: #eeeeee;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 40%;
      background: #6e6230;
      animation: slide 1.2s ease-in-out infinite;
    }
    .bar.idle > i { animation: none; width: 100%; background: #e3e3e3; }
    .bar.fail > i { animation: none; width: 100%; background: #8a2e2a; }
    @keyframes slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(350%); }
    }
    .server { margin-top: 22px; }
    .server label {
      display: block;
      margin-bottom: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #6e6230;
    }
    .server .row { display: flex; gap: 8px; }
    .server input {
      flex: 1;
      font: inherit;
      font-size: 12.5px;
      border: 1px solid #e3e3e3;
      background: #fff;
      color: #1c1c1c;
      padding: 7px 10px;
      border-radius: 3px;
      -webkit-user-select: text;
      user-select: text;
    }
    .actions { margin-top: 22px; display: none; gap: 8px; }
    .actions.show { display: flex; }
    button {
      font: inherit;
      font-size: 12.5px;
      border: 1px solid #e3e3e3;
      background: #fff;
      color: #1c1c1c;
      padding: 7px 12px;
      border-radius: 3px;
      cursor: pointer;
    }
    button.primary { background: #6e6230; color: #fff; border-color: #6e6230; }
    button:hover { border-color: #1c1c1c; }
    button.primary:hover { background: #5a5027; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="rule"></div>
    <div class="lockup">
      <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M32 5.8C36.8 5.6 44 8.8 50.2 11.6C54.6 13.8 58.4 16 57.2 18.4C55.6 21.4 50.8 23.6 46.4 24.6C45.2 26.4 44.4 28.8 44.2 32C44.4 35.2 45.2 37.6 46.4 39.4C50.8 40.4 55.6 42.6 57.2 45.6C58.4 48 54.6 50.2 50.2 52.4C44 55.2 36.8 58.4 32 58.2C27.2 58.4 20 55.2 13.8 52.4C9.4 50.2 5.6 48 6.8 45.6C8.4 42.6 13.2 40.4 17.6 39.4C18.8 37.6 19.6 35.2 19.8 32C19.6 28.8 18.8 26.4 17.6 24.6C13.2 23.6 8.4 21.4 6.8 18.4C5.6 16 9.4 13.8 13.8 11.6C20 8.8 27.2 5.6 32 5.8ZM23.6 18.4C26.2 15.8 28.8 15.8 32 15.8C35.2 15.8 37.8 15.8 40.4 18.4C37.8 21 35.2 21 32 21C28.8 21 26.2 21 23.6 18.4ZM23.6 45.6C26.2 43 28.8 43 32 43C35.2 43 37.8 43 40.4 45.6C37.8 48.2 35.2 48.2 32 48.2C28.8 48.2 26.2 48.2 23.6 45.6Z"/>
      </svg>
      <div>
        <div class="brand">Tacite</div>
        <div class="tag">Intelligence presse</div>
      </div>
    </div>
    <p id="status" class="status">Démarrage…</p>
    <div id="bar" class="bar"><i></i></div>
    <div id="actions" class="actions">
      <button class="primary" id="retry">Réessayer</button>
    </div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
