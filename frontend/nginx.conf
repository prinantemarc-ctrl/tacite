server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Résolution DNS à chaque requête : l'IP du conteneur api change à chaque rebuild
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Flux SSE de l'assistant : pas de mise en tampon, délais longs
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html ne doit jamais être mis en cache : sinon l'ancien bundle JS survit aux mises à jour
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /assets/ {
        # les bundles sont hachés : cache long sans risque
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
