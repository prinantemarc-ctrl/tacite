<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tacite — Press intelligence</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var loc = localStorage.getItem("tacite-locale") || "fr";
          document.documentElement.lang = loc === "en" ? "en" : "fr";
          document.title = loc === "en" ? "Tacite — Press intelligence" : "Tacite — Intelligence presse";
          var pref = localStorage.getItem("tacite-theme") || "system";
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#1a1916");
        } catch (e) {}
      })();
    </script>
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
